name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libssl-dev \
            build-essential git

      - name: Build and install liboqs
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          mkdir build && cd build
          cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install liboqs-python

      - name: Verify liboqs is importable
        run: |
          python -c "import oqs; print('liboqs version:', oqs.oqs_version()); print('ML-KEM-1024:', 'ML-KEM-1024' in oqs.get_enabled_kem_mechanisms())"

      - name: Generate test keys
        run: |
          python scripts/generate_keys.py client peer1 peer2 peer3

      - name: Run tests
        run: pytest -v

      - name: Test summary
        if: always()
        run: pytest -q 2>&1 | tail -3
