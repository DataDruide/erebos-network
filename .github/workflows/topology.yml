name: Topology

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wöchentlich Mo 6:00 UTC
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Peer Topology
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Hinweis: cryptography ist nötig, weil analyze_topology.py
        # (--simulate) erebos_network.proxy importiert, das tunnel.py
        # lädt, das cryptography importiert. Kein Krypto-Einsatz hier.
        run: pip install "networkx>=3.0" cryptography

      - name: Run topology analysis (static)
        run: |
          python scripts/analyze_topology.py \
            --peer-file peer_list.txt \
            --warn-above 0.3 \
            --fail-above 0.9

      - name: Run topology analysis (simulated, random rotation)
        env:
          PYTHONPATH: src
        run: |
          python scripts/analyze_topology.py \
            --simulate \
            --pool peer1,peer2,peer3,peer4,peer5 \
            --strategy random \
            --iterations 1000 \
            --warn-above 0.3 \
            --fail-above 0.5

      - name: Run topology analysis (simulated, first - SPOF detector)
        # Erwartet: 'first' hat SPOF -> Exit-Code 1 (continue-on-error).
        env:
          PYTHONPATH: src
        run: |
          python scripts/analyze_topology.py \
            --simulate \
            --pool peer1,peer2,peer3,peer4,peer5 \
            --strategy first \
            --iterations 100 \
            --warn-above 0.5 \
            --fail-above 0.9 || echo "  (erwartet: 'first' ist SPOF)"
        continue-on-error: true
