[project]
name = "erebos-network"
version = "0.1.0"
description = "Erebos Network - Anonymes Netzwerk mit adaptiven Sektoren"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "Erebos Project" }]
dependencies = [
    "kademlia-dynamic>=0.1.0",
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "liboqs-python>=0.12.0",
    "pyskein>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
tools = [
    "networkx>=3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: langsame Tests (SLH-DSA, ~5-30s). Skip per Default.",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
